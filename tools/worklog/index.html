    <div id="root"></div>
  
  <!-- dalek-worklog-sync:start -->
<script>
'use strict'

/**
 * Dalek 桌面宠物 · 工作记录同步
 *
 * 这段脚本由 `attach-worklog-sync.js` 注入到「工作记录.html」末尾，只做一件事：
 * 把 localStorage 里的任务列表（worklog.tasks.v1）推给本机 127.0.0.1:45873 的
 * Dalek 主进程。Dalek 没开着的时候静默失败，不影响页面本身的任何功能。
 *
 * 页面重新构建/导出后如果这段丢了，再跑一次：
 *
 *   node attach-worklog-sync.js "C:\Users\Administrator\Desktop\日常工作\工作记录.html"
 */
;(() => {
  const STORAGE_KEY = 'worklog.tasks.v1'
  const ENDPOINT = 'http://127.0.0.1:45873/dalek/worklog'
  const POLL_MS = 1500
  const MAX_RETRY_MS = 30000

  let lastSent = ''
  let retryAt = 0
  let failures = 0
  let pollTimer = 0
  let blocked = false

  function payload() {
    try {
      const list = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]')

      if (!Array.isArray(list)) {
        return ''
      }

      return JSON.stringify({
        page: location.href,
        // Dalek 只接受「设置里那份」工作记录推来的数据，别处的副本（比如备份文件
        // 用另一个浏览器打开，localStorage 是空的）会被拒收，免得示例任务盖掉真清单。
        file: location.protocol === 'file:' ? decodeURIComponent(location.pathname) : '',
        tasks: list.map(task => ({
          id: task && task.id,
          title: task && task.title,
          date: task && task.date,
          note: task && task.note,
          done: Boolean(task && task.done),
          createdAt: task && task.createdAt,
          completedAt: task && task.completedAt,
          attachments: task && Array.isArray(task.attachments) ? task.attachments.length : 0,
          feishu: Boolean(task && task.feishuUrl)
        }))
      })
    } catch {
      return ''
    }
  }

  function send() {
    if (blocked) {
      return
    }

    const body = payload()

    if (!body || body === lastSent || Date.now() < retryAt) {
      return
    }

    try {
      fetch(ENDPOINT, {
        method: 'POST',
        mode: 'cors',
        cache: 'no-store',
        credentials: 'omit',
        headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
        body
      })
        .then(response => {
          if (response.status === 409) {
            // 不是 Dalek 正在盯的那份文件：安静退出，别一直重试。
            blocked = true
            clearInterval(pollTimer)

            return
          }

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`)
          }

          lastSent = body
          failures = 0
          retryAt = 0
        })
        .catch(() => {
          failures += 1
          retryAt = Date.now() + Math.min(MAX_RETRY_MS, 1000 * 2 ** Math.min(failures, 5))
        })
    } catch {
      // 没有 fetch / 被策略拦住：页面照常用，只是不同步。
    }
  }

  function start() {
    send()
    pollTimer = setInterval(send, POLL_MS)
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start, { once: true })
  } else {
    start()
  }

  // 从别的标签页改任务、切回来、或者重新聚焦时，立刻补一次。
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      retryAt = 0
      send()
    }
  })

  window.addEventListener('focus', () => {
    retryAt = 0
    send()
  })

  window.addEventListener('storage', event => {
    if (!event.key || event.key === STORAGE_KEY) {
      retryAt = 0
      send()
    }
  })

  window.addEventListener('beforeunload', () => clearInterval(pollTimer))
})()
</script>
<!-- dalek-worklog-sync:end -->
  </body>
</html>
